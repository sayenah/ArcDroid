# SPDX-License-Identifier: GPL-2.0-only
name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  # Scheduled and manually dispatched runs use the full nightly tier.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3 ccache
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-host-gcc-${{ hashFiles('CMakeLists.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-host-gcc-${{ hashFiles('CMakeLists.txt') }}-
      - name: RPCEmu import guard
        run: python3 tools/check-rpcemu-import.py
      - name: Arculator import guard
        run: python3 tools/check-arculator-import.py
      - name: Asset guard
        run: tools/check-assets.sh
      - name: Configure
        run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build/host --verbose
      - name: Shipping source I/O guard self-test
        run: tools/check-shipping-io.sh --self-test
      - name: Unit tests and harness
        run: ctest -j "$(nproc)" --test-dir build/host --output-on-failure ${{ github.event_name == 'push' && '-LE slow' || '' }}
      - name: Export guard
        run: tools/check-exports.sh build/host/arcdroid_libretro.so
      - name: Configure profiling test build
        run: cmake -S . -B build/profile -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DARCDROID_RPC_PROFILE=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache
      - name: Build profiling tests
        run: cmake --build build/profile --target rpc-profile-tests
      - name: Profiling counts, transparency and mutants
        run: ctest -j "$(nproc)" --test-dir build/profile --output-on-failure -R '^rpc-profile-' ${{ github.event_name == 'push' && '-LE slow' || '' }}
      - name: ccache statistics
        if: always()
        run: ccache -s

  host-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3 ccache
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-host-gcc-${{ hashFiles('CMakeLists.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-host-gcc-${{ hashFiles('CMakeLists.txt') }}-
      - name: RPCEmu import guard
        run: python3 tools/check-rpcemu-import.py
      - name: Arculator import guard
        run: python3 tools/check-arculator-import.py
      - name: Asset guard
        run: tools/check-assets.sh
      - name: Configure
        run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build/host --verbose
      - name: Shipping source I/O guard self-test
        run: tools/check-shipping-io.sh --self-test
      - name: Unit tests and harness
        run: ctest -j "$(nproc)" --test-dir build/host --output-on-failure ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '-LE slow' || '' }}
      - name: Export guard
        run: tools/check-exports.sh build/host/arcdroid_libretro.so
      - name: Configure profiling test build
        run: cmake -S . -B build/profile -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DARCDROID_RPC_PROFILE=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache
      - name: Build profiling tests
        run: cmake --build build/profile --target rpc-profile-tests
      - name: Profiling counts, transparency and mutants
        run: ctest -j "$(nproc)" --test-dir build/profile --output-on-failure -R '^rpc-profile-' ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '-LE slow' || '' }}
      - name: ccache statistics
        if: always()
        run: ccache -s

  host-sanitizers:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3 ccache
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-host-sanitizers-gcc-${{ hashFiles('CMakeLists.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-host-sanitizers-gcc-${{ hashFiles('CMakeLists.txt') }}-
      - name: Configure ASan and UBSan
        run: cmake -S . -B build/sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DARCDROID_SANITIZERS=ON -DARCDROID_RPC_PROFILE=ON -DARCDROID_RPC_CROSSCHECK=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build ASan and UBSan
        run: cmake --build build/sanitize --verbose
      - name: Host tests under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest -j "$(nproc)" --test-dir build/sanitize --output-on-failure -R '${{ github.event_name != 'pull_request' && '.*' || '^(rpc-.*|left-stick-unit|left-stick-.*-harness|left-stick-input-trace|left-stick-equivalence-process|disc-request-unit|disc-resolver-unit|disc-request-.*-rom|disc-request-.*-process|disc-request-idle-trace|disc-request-commit-checks|disc-request-preflight-real-.*|error-box-unit|error-box-rom|error-box-x-rom|error-box-arbitration-.*|launch-outcome|launch-outcome-rom|hd-product-process|hd-started-process|hd-chooser-process|adf-refusal-rom|hard-disc-scope|hard-disc-program|power-on-chooser-harness|power-on-cmos|power-on-cmos-guest|power-on-shift-harness|power-on-recovery-harness|power-on-input-cancel-harness|boot-watch|boot-watch-.*-harness|boot-observation|boot-observation-harness|boot-observation-hd|boot-observation-.*-harness|cmos-device-bus|cmos-guest-exerciser|hard-disc-formatter|install-ide-registers|native-hard-disc-store|native-hd-guest-process|native-hd-stress-process|zip-content|core-services|launch-ramdisc-unit|launch-ramdisc-harness|short-tail-unit|short-raw-wd|short-raw-newio|short-tail-guest|short-tail-newio-guest|jfd-quarantine-zip-guest|jfd-quarantine-density|jfd-quarantine-adffs|short-tail-payload-guest|short-tail-discovery|adffs-package-media|adffs-shipping-profile|jfd-engine-reader|jfd-identification|jfd-file-data|jfd-file-data-store|jfd-file-data-newio|jfd-file-data-process|jfd-file-data-set-process|jfd-file-data-unavailable-process|jfd-file-data-reasons-process|jfd-file-data-recovery-process|jfd-file-data-gzip-process|jfd-file-data-zip-process|jfd-quarantine|jfd-quarantine-wd-guest|jfd-quarantine-newio-guest|jfd-tab-store|jfd-tab-(guest|routing|set|evidence)-process|jfd-store|jfd-guard-store|jfd-guard-wd|jfd-guard-newio|jfd-guard-process|native-writable-layout|jfd-controller-golden|newio-controller-golden|jfd-writes-libretro-harness|jfd-creation-process|jfd-merge-process|jfd-allocation-process|jfd-identification-process|jfd-gate-short|jfd-gate-irregular|jfd-gate-timing|helper-stress-harness|input-layout-harness|input-source-retirement|libretro-harness|newio-libretro-harness|mouse-script-harness)$' }}' ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '-LE slow' || '' }}
      - name: ccache statistics
        if: always()
        run: ccache -s

  windows:
    runs-on: windows-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: git mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-ccache mingw-w64-ucrt-x86_64-python
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-windows-ucrt64-gcc-${{ hashFiles('CMakeLists.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-windows-ucrt64-gcc-${{ hashFiles('CMakeLists.txt') }}-
      - name: RPCEmu import guard
        run: python3 tools/check-rpcemu-import.py
      - name: Configure
        # CMake retains DWARF only for the non-shipping plan core, RPC tests
        # and their private engine objects. Shipping remains plain Release.
        run: cmake -S . -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build/windows --verbose
      - name: Shipping source I/O guard self-test
        run: tools/check-shipping-io.sh --self-test
      - name: Validate crash locator and repeat Windows RPC CPU checks
        timeout-minutes: 10
        run: |
          set -e -o pipefail
          ctest -j "$NUMBER_OF_PROCESSORS" --test-dir build/windows --output-on-failure -R '^rpc-windows-crash-(locator|stderr)$' ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '-LE slow' || '' }} 2>&1 | tee build/windows/rpc-repeat.log
          ctest -j "$NUMBER_OF_PROCESSORS" --test-dir build/windows --output-on-failure --repeat until-fail:50 -R '^rpc-cpu-(mmu-memory|trace)$' ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '-LE slow' || '' }} 2>&1 | tee -a build/windows/rpc-repeat.log
      - name: Tests
        run: ctest -j "$NUMBER_OF_PROCESSORS" --test-dir build/windows --output-on-failure ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '-LE slow' || '' }}
      - name: Visible x86 hash identity and dispatch
        run: build/windows/hash_accel_test.exe --require-x86
      - name: Windows import and export guard
        run: tools/check-windows.sh build/windows/arcdroid_libretro.dll
      - name: Upload matching Windows RPC crash diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcdroid-windows-rpc-diagnostics
          path: |
            build/windows/rpc*.exe
            build/windows/hash_accel_test.exe
            build/windows/arcdroid*libretro*.dll
            !build/windows/arcdroid_lockprobe*.dll
            build/windows/rpc-repeat.log
            build/windows/Testing/Temporary/LastTest*.log
          if-no-files-found: warn
      - name: Package native RetroArch inputs
        run: |
          mkdir -p build/windows/retroarch-package
          cp build/windows/arcdroid_libretro.dll build/windows/arcdroid_libretro_test.dll build/windows/arcdroid_libretro.info build/windows/windows_load_harness.exe \
            build/windows/arcdroid_rpcplan_libretro.dll build/windows/arcdroid_rpcplan_libretro.info build/windows/rpc_runner.exe \
            build/windows/tests/fixtures/generated/arcdroid-test.rom \
            build/windows/tests/fixtures/generated/arcdroid-boot-prompt.rom \
            build/windows/tests/fixtures/generated/arcdroid-boot-prompt-write.rom \
            build/windows/tests/fixtures/generated/arcdroid-boot-cli.rom \
            build/windows/tests/fixtures/generated/arcdroid-boot-cli-confirm.rom \
            build/windows/tests/fixtures/generated/arcdroid-boot-horizon-edge.rom \
            build/windows/tests/fixtures/generated/arcdroid-boot-cli-then-prompt.rom \
            build/windows/tests/fixtures/generated/arcdroid-boot-desktop.rom \
            build/windows/tests/fixtures/generated/arcdroid-boot-two-phase.rom \
            build/windows/tests/fixtures/generated/arcdroid-boot-struct-one-to-several.rom \
            build/windows/tests/fixtures/generated/arcdroid-boot-struct-one-to-none.rom \
            build/windows/tests/fixtures/generated/arcdroid-boot-struct-none-to-one.rom \
            build/windows/tests/fixtures/generated/arcdroid-boot-struct-one-to-renamed.rom \
            build/windows/tests/fixtures/generated/arcdroid-boot-struct-sibling.rom \
            build/windows/tests/fixtures/generated/arcdroid-test.adf \
            build/windows/tests/fixtures/generated/arcdroid-error-box.rom \
            build/windows/tests/fixtures/generated/arcdroid-disc-request-a.rom \
            build/windows/tests/fixtures/generated/arcdroid-chooser-test.rom \
            build/windows/tests/fixtures/generated/arcdroid-chooser-d-test.rom \
            build/windows/tests/fixtures/generated/arcdroid-media-test.rom \
            build/windows/tests/fixtures/generated/arcdroid-jfd-save-test.rom \
            build/windows/tests/fixtures/generated/arcdroid-jfd-create-test.rom \
            build/windows/tests/fixtures/generated/arcdroid-jfd-merge-test.rom \
            build/windows/tests/fixtures/generated/arcdroid-jfd-merge-readback-test.rom \
            build/windows/tests/fixtures/generated/arcdroid-jfd-merge-missing-test.rom \
            build/windows/tests/fixtures/generated/arcdroid-jfd-guard-data.rom \
            build/windows/tests/fixtures/generated/arcdroid-jfd-allocation-veto-test.rom \
            build/windows/tests/fixtures/generated/arcdroid-jfd-allocation-claim-test.rom \
            build/windows/tests/fixtures/generated/arcdroid-jfd-allocation-read-test.rom \
            build/windows/tests/fixtures/generated/arcdroid-media.m3u \
            build/windows/tests/fixtures/generated/arcdroid-media-disc1.adf \
            build/windows/tests/fixtures/generated/arcdroid-media-disc2.adf \
            build/windows/tests/fixtures/generated/arcdroid-test.jfd \
            build/windows/tests/fixtures/generated/arcdroid-test-two-member.jfd \
            build/windows/tests/fixtures/generated/jfd-identification/sparse-d-timed.jfd \
            build/windows/tests/fixtures/generated/arcdroid-application-l.adl \
            build/windows/tests/fixtures/generated/arcdroid-chooser-l.adl \
            build/windows/tests/fixtures/generated/arcdroid-g1-chooser-l.adl \
            build/windows/tests/fixtures/generated/arcdroid-nested-chooser-l.adl \
            build/windows/tests/fixtures/generated/arcdroid-extended-chooser-d.adf \
            build/windows/tests/fixtures/generated/launch-family/boot-3-l.adl \
            build/windows/tests/fixtures/generated/launch-family/boot-file-3-l.adl \
            build/windows/tests/fixtures/generated/launch-family/boot-matrix-3-file-multiple.adf \
            build/windows/tests/fixtures/generated/launch-family/boot-matrix-3-file-zero.adf \
            build/windows/tests/fixtures/generated/launch-family/boot-struct-one-to-several.adf \
            build/windows/tests/fixtures/generated/launch-family/boot-struct-one-to-none.adf \
            build/windows/tests/fixtures/generated/launch-family/boot-struct-none-to-one.adf \
            build/windows/tests/fixtures/generated/launch-family/boot-struct-one-to-several.jfd \
            build/windows/tests/fixtures/generated/launch-family/boot-struct-one-to-renamed.adf \
            build/windows/tests/fixtures/generated/launch-family/boot-struct-sibling.adf \
            build/windows/tests/fixtures/generated/launch-family/boot-known-one-launchable.adf \
            build/windows/tests/fixtures/generated/adffs/synthetic.zip \
            build/windows/tests/fixtures/generated/arcdroid-native-hd-stress.rom \
            build/windows/tests/fixtures/generated/arcdroid-native-hd-guest.rom \
            build/windows/tests/fixtures/generated/arcdroid-short-tail-wd.rom \
            build/windows/tests/fixtures/generated/adffs/eligible.jfd \
            build/windows/tests/fixtures/generated/launch-family/checkpoint-a-top-bit.adf \
            build/windows/tests/fixtures/generated/hd-family/valid-f.adf \
            build/windows/tests/fixtures/generated/short-family/800k-d-one-sector.adf \
            build/windows/tests/fixtures/generated/short-family/800k-e-free-map.adf \
            build/windows/tests/fixtures/generated/short-family/800k-e-allocated-tail.adf \
            build/windows/tests/fixtures/generated/short-family/800k-e-conflicting-maps.adf \
            build/windows/tests/fixtures/generated/short-family/800k-e-conflicting-allocation.adf \
            build/windows/tests/fixtures/generated/short-family/800k-e-cyclic-free.adf \
            build/windows/tests/fixtures/generated/short-family/800k-e-unterminated.adf \
            build/windows/tests/fixtures/generated/short-family/discovery-directory-full.adf \
            build/windows/tests/fixtures/generated/short-family/discovery-directory-tail.adf \
            build/windows/tests/fixtures/generated/short-family/discovery-payload-tail.adf \
            build/windows/retroarch-package/
          cp -R build/windows/tests/fixtures/generated/Qaventra.adf \
            build/windows/retroarch-package/
          cp -R build/windows/tests/fixtures/generated/zip-content \
            build/windows/retroarch-package/
          cp -R build/windows/tests/fixtures/generated/jfd-writes \
            build/windows/retroarch-package/
          cp -R build/windows/tests/fixtures/generated/jfd-allocation \
            build/windows/retroarch-package/
          mkdir -p build/windows/retroarch-package/disc-request
          cp -R build/windows/generated/rpc-plans build/windows/retroarch-package/
          cp -R build/windows/generated/rpc-hd-retroarch build/windows/retroarch-package/
          nm -n build/windows/arcdroid_rpcplan_libretro.dll > build/windows/retroarch-package/rpc-hd-symbols.txt
          objdump -h -p build/windows/arcdroid_rpcplan_libretro.dll > build/windows/retroarch-package/rpc-hd-image.txt
          git rev-parse HEAD > build/windows/retroarch-package/rpc-hd-revision.txt
          cp build/windows/tests/fixtures/generated/disc-request/One.adf \
            build/windows/tests/fixtures/generated/disc-request/Two.adf \
            build/windows/tests/fixtures/generated/disc-request/Set.m3u \
            build/windows/retroarch-package/disc-request/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcdroid-windows-retroarch-input
          path: build/windows/retroarch-package/
          if-no-files-found: error
      - name: ccache statistics
        if: always()
        run: ccache -s

  windows-retroarch:
    # Native frontend sessions remain on PRs and the full nightly tier.
    # The merge tier is builds, guards and the non-slow CTest selection.
    if: github.event_name != 'push'
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arcdroid-windows-retroarch-input
          path: build/retroarch-input
      - name: Parse Windows RetroArch script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools/test-retroarch-windows.ps1).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: RetroArch 1.22.2 native load, power-on Shift, screenshot, and reloads
        shell: pwsh
        run: tools/test-retroarch-windows.ps1 -InputDirectory build/retroarch-input -WorkDirectory build/retroarch-native
      - name: Slice 28 guarded old-map JFD persistence and refusal
        shell: pwsh
        run: tools/test-retroarch-windows.ps1 -InputDirectory build/retroarch-input -WorkDirectory build/retroarch-native-guard -GuardedJfdOnly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: arcdroid-windows-retroarch-evidence
          path: |
            build/retroarch-native/evidence/
            build/retroarch-native-guard/evidence/
          if-no-files-found: warn

  android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: false
      - name: RPCEmu import and include guard
        run: python3 tools/check-rpcemu-import.py --compiler ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
      - name: Configure
        run: cmake -S . -B build/android -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DARCDROID_ANDROID_TEST_CORE=ON
      - name: Build
        run: cmake --build build/android --verbose
      - name: Shipping source I/O guard self-test
        run: tools/check-shipping-io.sh --self-test
      - name: ELF guard
        env:
          LLVM_READELF: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
        run: tools/check-android.sh build/android/arcdroid_libretro_android.so
      - name: P10b test core ELF and libretro exports
        env:
          LLVM_READELF: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
        run: tools/check-android.sh build/android/arcdroid_lockprobe_libretro_android.so
