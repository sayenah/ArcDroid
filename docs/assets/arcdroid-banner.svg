<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">ArcDroid: select game, then play</title>
  <desc id="d">A stylised wedge-shaped home computer with a floppy disc entering its drive, joined by a trail of coloured pixel sparks to a handheld game device and a desktop monitor. The ArcDroid wordmark sits in the centre with the tagline Select game, then play.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1028"/>
      <stop offset="0.55" stop-color="#151a46"/>
      <stop offset="1" stop-color="#24145a"/>
    </linearGradient>
    <radialGradient id="halo" cx="640" cy="185" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b6cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="slotGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd54a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd54a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="330" y1="0" x2="950" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4d5a"/>
      <stop offset="0.35" stop-color="#ffc93c"/>
      <stop offset="0.68" stop-color="#3ddc84"/>
      <stop offset="1" stop-color="#3fa9ff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123b5a"/>
      <stop offset="1" stop-color="#0a1f33"/>
    </linearGradient>
    <linearGradient id="caseTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ede1"/>
      <stop offset="1" stop-color="#d9d2c1"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="7" y="7" width="2" height="2" fill="#9aa6ff" opacity="0.16"/>
    </pattern>
    <pattern id="keys" x="0" y="0" width="22" height="20" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="18" height="13" rx="3" fill="#b3ab98"/>
      <rect x="2" y="3" width="18" height="10" rx="3" fill="#c9c1ae"/>
    </pattern>
    <clipPath id="deck">
      <polygon points="22,40 278,40 300,150 0,150"/>
    </clipPath>
    <clipPath id="card">
      <rect width="1280" height="400" rx="28"/>
    </clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Card: a self-contained dark panel so it reads on GitHub light and dark themes -->
  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#dots)"/>
    <rect width="1280" height="400" fill="url(#halo)"/>
    <!-- faint horizon lines -->
    <g stroke="#7f8cff" stroke-opacity="0.08" stroke-width="1">
      <line x1="0" y1="330" x2="1280" y2="330"/>
      <line x1="0" y1="352" x2="1280" y2="352"/>
      <line x1="0" y1="378" x2="1280" y2="378"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1278.5" height="398.5" rx="27.5" fill="none" stroke="#8e9bff" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Spark trail: one game, from the floppy to today's devices -->
  <path d="M 330 300 Q 640 392 950 292" fill="none" stroke="url(#trail)" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 16"/>
  <path d="M 330 300 Q 640 392 950 292" fill="none" stroke="url(#trail)" stroke-width="14" stroke-linecap="round" stroke-dasharray="1 16" opacity="0.25" filter="url(#soft)"/>
  <g>
    <rect x="300" y="96" width="9" height="9" fill="#ff4d5a" transform="rotate(20 304 100)"/>
    <rect x="326" y="128" width="6" height="6" fill="#ffc93c" transform="rotate(35 329 131)"/>
    <rect x="318" y="72" width="5" height="5" fill="#3ddc84"/>
    <rect x="470" y="352" width="7" height="7" fill="#ffc93c" transform="rotate(45 473 355)"/>
    <rect x="802" y="342" width="7" height="7" fill="#3ddc84" transform="rotate(30 805 345)"/>
    <rect x="900" y="300" width="6" height="6" fill="#3fa9ff"/>
  </g>

  <!-- Wedge home computer (generic, stylised) -->
  <g transform="translate(46 140)" filter="url(#shadow)">
    <!-- floppy disc, half inserted into the drive slot -->
    <g>
      <rect x="160" y="-58" width="88" height="80" rx="4" fill="#2d63c8"/>
      <rect x="172" y="-48" width="64" height="38" rx="2" fill="#f4f1e8"/>
      <g stroke="#9aa3b5" stroke-width="2">
        <line x1="180" y1="-38" x2="228" y2="-38"/>
        <line x1="180" y1="-29" x2="228" y2="-29"/>
        <line x1="180" y1="-20" x2="214" y2="-20"/>
      </g>
      <rect x="236" y="-58" width="12" height="10" fill="#1d4796"/>
    </g>
    <!-- back riser with drive -->
    <rect x="30" y="12" width="240" height="34" rx="7" fill="#d6cfbd"/>
    <ellipse cx="204" cy="15" rx="70" ry="14" fill="url(#slotGlow)" opacity="0.7"/>
    <rect x="152" y="11" width="104" height="8" rx="3" fill="#2a2a33"/>
    <circle cx="132" cy="30" r="4" fill="#3ddc84"/>
    <circle cx="132" cy="30" r="9" fill="#3ddc84" opacity="0.25" filter="url(#soft)"/>
    <!-- keyboard deck -->
    <polygon points="22,40 278,40 300,150 0,150" fill="url(#caseTop)"/>
    <g clip-path="url(#deck)">
      <rect x="20" y="50" width="262" height="80" fill="url(#keys)"/>
      <rect x="84" y="131" width="134" height="12" rx="4" fill="#b3ab98"/>
      <rect x="84" y="131" width="134" height="9" rx="4" fill="#c9c1ae"/>
      <rect x="244" y="133" width="18" height="11" rx="3" fill="#ffc93c"/>
    </g>
    <!-- front strip -->
    <rect x="0" y="150" width="300" height="24" rx="4" fill="#bfb7a4"/>
    <rect x="16" y="159" width="60" height="5" rx="2.5" fill="#a39b87"/>
    <!-- small four-colour accent, generic -->
    <g>
      <rect x="226" y="159" width="12" height="6" rx="1" fill="#ff4d5a"/>
      <rect x="241" y="159" width="12" height="6" rx="1" fill="#ffc93c"/>
      <rect x="256" y="159" width="12" height="6" rx="1" fill="#3ddc84"/>
      <rect x="271" y="159" width="12" height="6" rx="1" fill="#3fa9ff"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g text-anchor="middle">
    <text x="640" y="182" font-family="'Avenir Next', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="100" font-weight="800" letter-spacing="-2" fill="#5b6cff" opacity="0.45" filter="url(#soft)">ArcDroid</text>
    <text x="640" y="182" font-family="'Avenir Next', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="100" font-weight="800" letter-spacing="-2" fill="#f7f5ff">ArcDroid</text>
  </g>
  <g>
    <rect x="520" y="204" width="56" height="6" rx="3" fill="#ff4d5a"/>
    <rect x="584" y="204" width="56" height="6" rx="3" fill="#ffc93c"/>
    <rect x="648" y="204" width="56" height="6" rx="3" fill="#3ddc84"/>
    <rect x="712" y="204" width="56" height="6" rx="3" fill="#3fa9ff"/>
  </g>
  <text x="640" y="252" text-anchor="middle" font-family="'Avenir Next', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="7" fill="#9fe3ff">SELECT GAME → PLAY</text>
  <text x="640" y="288" text-anchor="middle" font-family="'Avenir Next', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="1" fill="#b9c0e6">Archimedes games for RetroArch · Windows PC · Android</text>

  <!-- Desktop monitor (generic) -->
  <g filter="url(#shadow)">
    <rect x="1030" y="58" width="196" height="124" rx="12" fill="#1b2040" stroke="#4a5290" stroke-width="2"/>
    <rect x="1042" y="70" width="172" height="100" rx="6" fill="url(#screen)"/>
    <g opacity="0.9">
      <rect x="1056" y="84" width="60" height="8" rx="2" fill="#3fa9ff"/>
      <rect x="1056" y="98" width="92" height="8" rx="2" fill="#3ddc84"/>
      <rect x="1056" y="112" width="44" height="8" rx="2" fill="#ffc93c"/>
    </g>
    <rect x="1112" y="182" width="32" height="18" fill="#2a3060"/>
  </g>

  <!-- Handheld game device (generic, no real product likeness) -->
  <g filter="url(#shadow)">
    <rect x="922" y="168" width="296" height="134" rx="56" fill="#272c4f" stroke="#58609e" stroke-width="2"/>
    <rect x="994" y="182" width="152" height="106" rx="10" fill="#0a0d1f"/>
    <rect x="1000" y="188" width="140" height="94" rx="6" fill="url(#screen)"/>
    <!-- abstract screen content: pointer, floppy glyph, bars -->
    <polygon points="1022,204 1022,232 1030,224 1036,238 1042,235 1036,222 1047,222" fill="#f7f5ff"/>
    <g transform="translate(1078 202)">
      <rect width="30" height="30" rx="3" fill="#2d63c8"/>
      <rect x="6" y="3" width="18" height="10" rx="1" fill="#c9d2e6"/>
      <rect x="5" y="17" width="20" height="10" rx="1" fill="#f4f1e8"/>
    </g>
    <rect x="1014" y="252" width="38" height="8" rx="2" fill="#ff4d5a"/>
    <rect x="1056" y="252" width="38" height="8" rx="2" fill="#ffc93c"/>
    <rect x="1098" y="252" width="28" height="8" rx="2" fill="#3ddc84"/>
    <rect x="1014" y="266" width="80" height="5" rx="2" fill="#3fa9ff" opacity="0.7"/>
    <!-- D-pad -->
    <g fill="#141833">
      <rect x="944" y="225" width="36" height="12" rx="3"/>
      <rect x="956" y="213" width="12" height="36" rx="3"/>
    </g>
    <!-- face buttons -->
    <circle cx="1188" cy="215" r="7" fill="#ffc93c"/>
    <circle cx="1174" cy="230" r="7" fill="#3fa9ff"/>
    <circle cx="1202" cy="230" r="7" fill="#ff4d5a"/>
    <circle cx="1188" cy="245" r="7" fill="#3ddc84"/>
    <!-- sticks -->
    <circle cx="962" cy="276" r="9" fill="#141833" stroke="#3a4170" stroke-width="2"/>
    <circle cx="1176" cy="276" r="9" fill="#141833" stroke="#3a4170" stroke-width="2"/>
  </g>
</svg>